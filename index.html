<!doctype html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>כיפות ירושלים | חנות כיפות אונליין</title>
    <meta name="description" content="חנות כיפות מודרנית ונוחה עם חיפוש וסינון בזמן אמת." />

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              brand: {
                navy: '#0f172a',
                gold: '#c8a96b',
                mist: '#f8fafc'
              }
            }
          }
        }
      };
    </script>

    <link rel="stylesheet" href="style.css" />
  </head>
  <body class="bg-brand-mist text-slate-800">
    <header class="bg-brand-navy text-white shadow-sm">
      <div class="mx-auto max-w-7xl px-4 py-6 md:px-6 flex items-center justify-between gap-4">
        <div>
          <h1 class="text-2xl md:text-3xl font-bold">כיפות ירושלים</h1>
          <p class="text-slate-200 text-sm md:text-base mt-1">כיפות איכותיות בעיצוב מכובד לכל אירוע</p>
        </div>
        <button id="cart-toggle" class="relative rounded-lg bg-white/10 px-4 py-2 text-sm hover:bg-white/20 transition">
          עגלה
          <span id="cart-count" class="absolute -top-2 -left-2 min-w-5 h-5 px-1 rounded-full bg-brand-gold text-brand-navy text-xs font-bold flex items-center justify-center">0</span>
        </button>
      </div>
    </header>

    <main class="mx-auto max-w-7xl px-4 py-6 md:px-6 space-y-6">
      <section class="bg-white rounded-xl shadow-sm p-4 md:p-5">
        <h2 class="font-semibold text-lg mb-4">חיפוש וסינון</h2>
        <div class="grid grid-cols-1 md:grid-cols-3 gap-3">
          <label class="flex flex-col gap-1 text-sm">
            <span class="text-slate-600">חיפוש לפי שם</span>
            <input
              id="search-input"
              type="text"
              placeholder="לדוגמה: כיפת קטיפה שחורה"
              class="h-11 rounded-lg border border-slate-300 px-3 focus:outline-none focus:ring-2 focus:ring-brand-gold"
            />
          </label>

          <label class="flex flex-col gap-1 text-sm">
            <span class="text-slate-600">סינון לפי צבע</span>
            <select id="color-filter" class="h-11 rounded-lg border border-slate-300 px-3 bg-white focus:outline-none focus:ring-2 focus:ring-brand-gold">
              <option value="">כל הצבעים</option>
            </select>
          </label>

          <label class="flex flex-col gap-1 text-sm">
            <span class="text-slate-600">סינון לפי מידה</span>
            <select id="size-filter" class="h-11 rounded-lg border border-slate-300 px-3 bg-white focus:outline-none focus:ring-2 focus:ring-brand-gold">
              <option value="">כל המידות</option>
            </select>
          </label>
        </div>
      </section>

      <section>
        <div id="results-info" class="mb-3 text-sm text-slate-600"></div>
        <div id="products-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-4"></div>
        <p id="empty-state" class="hidden text-center text-slate-500 bg-white rounded-xl p-10 shadow-sm">לא נמצאו כיפות לפי הסינון שבחרת.</p>
      </section>
    </main>

    <aside id="cart-drawer" class="fixed top-0 left-0 h-full w-full max-w-sm bg-white shadow-2xl transform -translate-x-full transition-transform duration-300 z-50">
      <div class="h-full flex flex-col">
        <div class="p-4 border-b flex items-center justify-between">
          <h3 class="text-lg font-bold">עגלת קניות</h3>
          <button id="cart-close" class="text-slate-500 hover:text-slate-700">סגור</button>
        </div>
        <div id="cart-items" class="flex-1 overflow-y-auto p-4 space-y-3"></div>
        <div class="p-4 border-t space-y-3">
          <div class="flex items-center justify-between font-semibold">
            <span>סה"כ לתשלום</span>
            <span id="cart-total">₪0</span>
          </div>
          <button class="w-full bg-brand-navy text-white rounded-lg py-2.5 hover:bg-slate-800 transition">להמשך הזמנה</button>
        </div>
      </div>
    </aside>
    <div id="overlay" class="fixed inset-0 bg-black/40 hidden z-40"></div>

    <script src="data.js"></script>
    <script src="app.js"></script>
  </body>
</html>
